  function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

  function shuffle(items) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function resetGame() {
    const shuffled = shuffle(STORMS);

  }

  function doseLimit() { return CONFIG.doseLimit[state.difficulty]; }
  function stormStrength(storm) {
    return state.difficulty === 'cadet' ? Math.max(1, storm.strength - 1) : storm.strength;
  }
  function stormWarning(storm) {
    return state.difficulty === 'cadet' ? storm.warningDays + 1 : storm.warningDays;

  function startBriefing() {

  function startMission() {

  // Queue an action only. Its effects are previewed, not applied yet.
  function applyAction(name) {
    if (!ACTIONS[name] || state.screen !== 'day') return;
    if (state.queue.length >= SLOTS_PER_DAY) {
      actionMessage = 'All three action slots are full. Remove one to make room.';
      render();
      return;
    }
    let previewPower = state.meters.power;
    for (const queuedName of state.queue) {
      previewPower = clamp(previewPower + ACTIONS[queuedName].power, 0, 10);
    }
    const nextPower = clamp(previewPower + ACTIONS[name].power, 0, 10);
    if (nextPower < 0 || (ACTIONS[name].power < 0 && previewPower < Math.abs(ACTIONS[name].power))) {
      actionMessage = 'Not enough Power for that action. Try resting or choose a different job.';
      render();
      return;
    }
    state.queue.push(name);
    actionMessage = ACTIONS[name].name + ' added to the plan.';
    render();
    announce(actionMessage);
  }

  function removeQueuedAction(index) {
    if (index < 0 || index >= state.queue.length) return;
    const removed = ACTIONS[state.queue[index]].name;
    state.queue.splice(index, 1);
    actionMessage = removed + ' removed from the plan.';
    render();
    announce(actionMessage);
  }

  function getPreviewMeters() {
    const preview = { ...state.meters };
    state.queue.forEach(function(name) {
      const action = ACTIONS[name];
      preview.power = clamp(preview.power + action.power, 0, 10);
      preview.oxygen = clamp(preview.oxygen + action.oxygen, 0, 10);
      preview.shield = clamp(preview.shield + action.shield, 0, 10);
      preview.science += action.science;
      preview.harvest += action.harvest;
    });
    return preview;
  }

  function resolveStorm(choice) {
    if (state.screen !== 'storm') return;
    const before = { ...state.meters };
    const queuedNames = state.queue.slice();
    const strength = stormStrength(state.currentStorm);
    let doseTaken = 0;
    let workDone = [];

    if (choice === 'work') {
      queuedNames.forEach(function(name) {
        performAction(name);
        workDone.push(ACTIONS[name].name);
      });
      doseTaken = Math.max(0, strength * 2 - state.meters.shield);
      state.crewSheltered = false;

      doseTaken = Math.ceil(Math.max(0, strength * 2 - state.meters.shield) / SHELTER_DIVISOR);
      state.crewSheltered = true;

    state.meters.dose += doseTaken;
    state.queue = [];
    const doseAfterStorm = state.meters.dose;
    state.meters.oxygen = clamp(state.meters.oxygen - 1, 0, 10);
    const solarGain = isNightDay(state.day) ? 0 : CONFIG.solarIncome;
    state.meters.power = clamp(state.meters.power + solarGain, 0, 10);

    const after = { ...state.meters };
    let reason = '';
    if (state.meters.oxygen <= 0) {

    state.lastResult = {

      doseAfterStorm: doseAfterStorm, solarGain: solarGain,
      strength: strength, queuedNames: queuedNames,

  function moduleKey(event, action) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      applyAction(action);
    }
  }

  // -------------------- PAGE RENDERING --------------------
  function renderTopbar() {
    const right = document.getElementById('topbarRight');
    if (!right) return;
    if (state.screen === 'day' || state.screen === 'storm' || state.screen === 'result' || state.screen === 'learn') {
      const dots = Array.from({ length: DAYS }, function(_, i) {
        let cls = 'day-dot';
        if (i + 1 < state.day) cls += ' done';
        if (i + 1 === state.day) cls += ' current';
        return `<span class="${cls}" aria-hidden="true"></span>`;
      }).join('');
      right.innerHTML = `<span class="tracker-label">Mission day</span><div class="day-tracker" aria-label="Day ${state.day} of ${DAYS}">${dots}</div><span class="difficulty-pill">${state.difficulty === 'cadet' ? 'Cadet' : 'Pilot'}</span><button class="about-link" onclick="openAbout()">About</button>`;
    } else if (state.screen === 'about') {
      right.innerHTML = `<button class="about-link" onclick="closeAbout()">Back</button>`;
    } else if (state.screen === 'debrief') {
      right.innerHTML = `<button class="about-link" onclick="openAbout()">About</button>`;
    } else {
      right.innerHTML = `<button class="about-link" onclick="openAbout()">About and data</button>`;
    }
  }

  function render() {
    document.title = GAME_TITLE;
    document.getElementById('brandName').textContent = GAME_TITLE;
    renderTopbar();
    const app = document.getElementById('app');
    const screens = {
      title: renderTitle,
      briefing: renderBriefing,
      day: renderDay,
      storm: renderStorm,
      result: renderResult,
      learn: renderLearn,
      debrief: renderDebrief,
      about: renderAbout
    };
    app.innerHTML = (screens[state.screen] || renderTitle)();
    const heading = app.querySelector('h1');
    if (heading) {
      heading.setAttribute('tabindex', '-1');
      heading.focus({ preventScroll: true });
    }
  }

  function renderBriefing() {
    return `<section class="screen" aria-labelledby="screenTitle">
      <p class="eyebrow">Mission briefing</p>
      <h1 class="screen-heading" id="screenTitle">Every choice uses the same budget.</h1>
      <p class="screen-intro">Your base has limited Power. Each day, choose what matters most before a solar storm arrives.</p>
      <div class="briefing-layout">
        <div>
          <ol class="briefing-list">
            <li><p><strong><button class="word" onclick="openDefinition('Power')">Power</button> runs the base.</strong> Generators, the greenhouse, shielding and science all need electricity.</p></li>
            <li><p><strong><button class="word" onclick="openDefinition('Oxygen')">Oxygen</button> and food keep the crew going.</strong> Watch your supplies as the days pass.</p></li>
            <li><p><strong><button class="word" onclick="openDefinition('Shielding')">Shielding</button> helps protect the crew.</strong> When a storm arrives, choose whether to keep working or enter the <button class="word" onclick="openDefinition('Shelter')">shelter</button>.</p></li>
          </ol>
          <p>Tap these words to learn what they mean: <button class="word" onclick="openDefinition('Crew Dose')">Crew Dose</button>, <button class="word" onclick="openDefinition('Radiation')">Radiation</button> and <button class="word" onclick="openDefinition('Solar storm')">Solar storm</button>.</p>
          <p><button class="text-button" onclick="showCard('DELAY','briefing')">Why can’t Earth just tell us what to do?</button></p>

        </div>
        <aside class="briefing-side">
          <h2>Your mission goals</h2>
          <p>Survive all ten days, keep Crew Dose within the mission limit, and meet both science and food goals.</p>
          <p><strong>Science:</strong> at least ${CONFIG.goals.science}</p>
          <p><strong>Food harvest:</strong> at least ${CONFIG.goals.harvest}</p>
          <p><strong>Storm decision:</strong> work to complete queued jobs and take the full dose, or shelter and discard the plan to reduce the dose.</p>
        </aside>
      </div>
    </section>`;
  }

  function renderForecast() {
    const known = [];
    for (let i = state.day; i < DAYS; i++) {
      const storm = state.storms[i];
      if (stormWarning(storm) > 0 && (i + 1 - stormWarning(storm)) <= state.day) {
        known.push({ day: i + 1, storm: storm });
      }
    }
    if (!known.length) return `<span class="forecast-empty">No later storm warnings received yet.</span>`;
    return known.slice(0, 4).map(function(item) {
      return `<div class="forecast-item">Day ${item.day}: <strong>${item.storm.type === 'flare' ? 'Flare' : item.storm.type}</strong> · Strength ${stormStrength(item.storm)}</div>`;
    }).join('');
  }

  function renderMeters(preview) {
    const shown = preview || state.meters;
    const meterInfo = [
      ['power', 'Power', shown.power, state.meters.power, preview && preview.power !== state.meters.power],
      ['oxygen', 'Oxygen', shown.oxygen, state.meters.oxygen, preview && preview.oxygen !== state.meters.oxygen],
      ['shield', 'Shielding', shown.shield, state.meters.shield, preview && preview.shield !== state.meters.shield],
      ['dose', 'Crew Dose', shown.dose, state.meters.dose, false]
    ];
    return meterInfo.map(function(item) {
      const key = item[0];
      const val = item[2];
      const current = item[3];
      const changed = item[4];
      const width = key === 'dose' ? Math.min(100, val / doseLimit() * 100) : clamp(val, 0, 10) * 10;
      const currentWidth = key === 'dose' ? Math.min(100, current / doseLimit() * 100) : clamp(current, 0, 10) * 10;
      const ghost = changed ? `<span class="meter-ghost" style="left:${Math.min(width,currentWidth)}%;"></span>` : '';
      let extra = '';
      if (key === 'dose') extra = `<div class="meter-note">Mission limit: ${doseLimit()} · ${val > doseLimit() ? 'Over limit' : 'Within limit'}</div>`;
      else if (changed) extra = `<div class="meter-note">Now ${current}; after plan ${val}</div>`;
      const high = key === 'dose' && val > doseLimit() ? ' critical' : (key === 'dose' && val > doseLimit() * .7 ? ' high' : '');
      return `<div class="meter ${key === 'dose' ? 'dose-meter' + high : ''}">
        <div class="meter-top"><span class="meter-name">${item[1]}</span><span class="meter-value">${val}${key === 'dose' ? '' : ' / 10'}</span></div>
        <div class="meter-track" role="meter" aria-label="${item[1]}" aria-valuemin="0" aria-valuemax="${key === 'dose' ? doseLimit() : 10}" aria-valuenow="${val}"><div class="meter-fill ${key}" style="width:${width}%"></div>${ghost}</div>${extra}
      </div>`;
    }).join('');
  }

  function renderSeesaw(preview) {
    const shown = preview || state.meters;
    const angle = clamp((shown.power - shown.shield) * 3, -18, 18);
    return `<div class="seesaw">
      <svg viewBox="0 0 320 68" role="img" aria-label="Power and Shielding balance seesaw">
        <path d="M160 42 139 66h42Z" fill="#9A958E" stroke="#E6E3DC" stroke-width="1.5"/>
        <g transform="rotate(${angle} 160 42)"><path d="M35 36H285" stroke="#C9A24A" stroke-width="5"/><path d="M55 36v-13h54v13M211 36v-13h54v13" fill="#2B4A8C" stroke="#E6E3DC" stroke-width="1.5"/><text x="82" y="18" fill="#E6E3DC" font-size="10" text-anchor="middle">Power</text><text x="238" y="18" fill="#E6E3DC" font-size="10" text-anchor="middle">Shielding</text></g>
      </svg>
      <p class="seesaw-caption">Power and Shielding compete for the same budget.</p>
    </div>`;
  }

  function renderActionButton(name) {
    const action = ACTIONS[name];
    const powerWord = action.power < 0 ? `− ${Math.abs(action.power)} Power` : `+ ${action.power} Power`;
    const otherChips = [];
    if (action.oxygen > 0) otherChips.push(`+ ${action.oxygen} Oxygen`);
    if (action.oxygen < 0) otherChips.push(`− ${Math.abs(action.oxygen)} Oxygen`);
    if (action.shield > 0) otherChips.push(`+ ${action.shield} Shielding`);
    if (action.science > 0) otherChips.push(`+ ${action.science} Science`);
    if (action.harvest > 0) otherChips.push(`+ ${action.harvest} Harvest`);
    return `<button class="action-button" onclick="applyAction('${name}')" ${state.queue.length >= SLOTS_PER_DAY ? 'disabled' : ''}>
      ${icon(action.icon, 'action-icon')}
      <span><span class="action-name">${action.name}</span><span class="action-desc">${action.description}</span></span>
      <span class="chips"><span class="chip power">⚡ ${powerWord}</span>${otherChips.map(function(chip) { return `<span class="chip">＋ ${chip}</span>`; }).join('')}</span>
    </button>`;

  // -------------------- LIVE DATA STATUS --------------------
  async function loadLiveStorms() {
    const controller = new AbortController();
    const timeout = window.setTimeout(function() { controller.abort(); }, 4000);
    try {
      // Confirm field names against the current DONKI response before using a production key.
      const response = await fetch('https://api.nasa.gov/DONKI/FLR?api_key=' + NASA_KEY, { signal: controller.signal });
      if (!response.ok) throw new Error('NASA DONKI request failed');
      const records = await response.json();
      const flareRecords = Array.isArray(records) ? records : [];
      const classes = flareRecords.map(function(item) { return item.classType; }).filter(Boolean);
      const order = ['A','B','C','M','X'];
      const strongest = classes.sort(function(a,b) { return order.indexOf(b.charAt(0)) - order.indexOf(a.charAt(0)); })[0];
      liveDataMessage = 'Live from NASA DONKI';
      liveDataDetail = flareRecords.length + ' flare records returned.' + (strongest ? ' Strongest listed class: ' + strongest + '.' : ' No classType field was available.');
    } catch (error) {
      liveDataMessage = 'Archived NASA data: live request unavailable';
      liveDataDetail = 'The mission can still be played offline using clearly marked sample events.';
    } finally {
      window.clearTimeout(timeout);
      if (state.screen === 'title' || state.screen === 'about') render();
    }
  }

  // -------------------- REAL NASA STORM RECORDS (added) --------------------
  // These functions turn real NASA DONKI records into storm cards. If NASA cannot be reached,
  // the game keeps using the clearly marked sample events, so it never breaks.
  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, function(character) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
    });
  }

  function dateOnly(value) {
    const match = /^(\d{4}-\d{2}-\d{2})/.exec(String(value || ''));
    return match ? match[1] : null;
  }

  function safeId(value) {
    const text = String(value || '');
    return /^[A-Za-z0-9._:+-]{3,80}$/.test(text) ? text : null;
  }

  // Our own simple 1-5 scale (not an official NASA rating). Flares: M1-M4 = 2, M5-M9 = 3, X1-X4 = 4, X5+ = 5.
  function flareStrength(flareClass) {
    const letter = flareClass.charAt(0);
    const number = parseFloat(flareClass.slice(1)) || 1;
    if (letter === 'X') return number < 5 ? 4 : 5;
    if (letter === 'M') return number < 5 ? 2 : 3;
    return 1;
  }

  // CME speed in km/s: under 500 = 1, 500-999 = 2, 1000-1499 = 3, 1500-1999 = 4, 2000+ = 5.
  function cmeStrength(speed) {
    if (typeof speed !== 'number' || isNaN(speed)) return 2;
    return 1 + [500, 1000, 1500, 2000].filter(function(limit) { return speed >= limit; }).length;
  }

  function flareFromRecord(item) {
    const flareClass = String(item.classType || '').toUpperCase();
    if (!/^[MX]\d+(\.\d+)?$/.test(flareClass)) return null; // Keep only the bigger flares (M and X).
    const date = dateOnly(item.peakTime || item.beginTime);
    const id = safeId(item.flrID);
    if (!date || !id) return null;
    return { id: id, donkiId: id, type: 'flare', date: date, sizeNote: 'Class ' + flareClass + ' solar flare', strength: flareStrength(flareClass), warningDays: 0, source: 'NASA DONKI' };
  }

  function cmeFromRecord(item) {
    const date = dateOnly(item.startTime);
    const id = safeId(item.activityID);
    if (!date || !id) return null;
    const analyses = Array.isArray(item.cmeAnalyses) ? item.cmeAnalyses : [];
    const best = analyses.find(function(a) { return a && a.isMostAccurate && typeof a.speed === 'number'; }) ||
                 analyses.find(function(a) { return a && typeof a.speed === 'number'; });
    const speed = best ? best.speed : null;
    const note = speed ? 'CME at ' + Math.round(speed).toLocaleString('en-US') + ' km/s' : 'CME, speed not listed';
    return { id: id, donkiId: id, type: 'CME', date: date, sizeNote: note, strength: cmeStrength(speed), warningDays: 2, source: 'NASA DONKI' };
  }

  function sepFromRecord(item) {
    const date = dateOnly(item.eventTime);
    const id = safeId(item.sepID);
    if (!date || !id) return null;
    // DONKI particle events carry no simple size in this list, so every one is rated 3 (our own simple choice).
    return { id: id, donkiId: id, type: 'SEP', date: date, sizeNote: 'Solar energetic particle event', strength: 3, warningDays: 1, source: 'NASA DONKI' };
  }

  // Choose events spread from weakest to strongest so every mission has some variety.
  function pickSpread(list, count) {
    const seen = {};
    const unique = list.filter(function(item) { if (seen[item.id]) return false; seen[item.id] = true; return true; });
    const sorted = unique.sort(function(a, b) { return a.strength - b.strength || (a.date < b.date ? -1 : 1); });
    if (sorted.length <= count) return sorted;
    const picked = [];
    for (let i = 0; i < count; i++) picked.push(sorted[Math.round(i * (sorted.length - 1) / (count - 1))]);
    return picked.filter(function(item, index) { return picked.indexOf(item) === index; });
  }

  function isValidStorm(storm) {
    return Boolean(storm) && ['flare', 'CME', 'SEP'].indexOf(storm.type) !== -1 &&
      Number.isInteger(storm.strength) && storm.strength >= 1 && storm.strength <= 5 &&
      Number.isInteger(storm.warningDays) && storm.warningDays >= 0 && storm.warningDays <= 2 &&
      Boolean(dateOnly(storm.date)) && Boolean(safeId(storm.donkiId)) &&
      typeof storm.sizeNote === 'string' && /^[A-Za-z0-9 ,.\/-]{1,80}$/.test(storm.sizeNote);
  }

  async function donkiGet(request) {
    const controller = new AbortController();
    const timeout = window.setTimeout(function() { controller.abort(); }, 12000);
    try {
      const url = 'https://api.nasa.gov/DONKI/' + request.type + '?startDate=' + request.start + '&endDate=' + request.end + '&api_key=' + encodeURIComponent(NASA_KEY);
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) throw new Error('DONKI ' + request.type + ' request failed: ' + response.status);
      const data = await response.json();
      return Array.isArray(data) ? data : [];
    } finally {
      window.clearTimeout(timeout);
    }
  }

  async function fetchDonkiStorms() {
    const results = await Promise.allSettled(DONKI_REQUESTS.map(donkiGet));
    const groups = { flare: [], CME: [], SEP: [] };
    results.forEach(function(result, index) {
      if (result.status !== 'fulfilled') return;
      const type = DONKI_REQUESTS[index].type;
      result.value.forEach(function(item) {
        if (!item || typeof item !== 'object') return;
        const storm = type === 'FLR' ? flareFromRecord(item) : type === 'CME' ? cmeFromRecord(item) : sepFromRecord(item);
        if (storm) groups[storm.type].push(storm);
      });
    });
    const picked = [].concat(pickSpread(groups.flare, MAX_PER_TYPE.flare), pickSpread(groups.CME, MAX_PER_TYPE.CME), pickSpread(groups.SEP, MAX_PER_TYPE.SEP));
    if (picked.length < MIN_REAL_STORMS) throw new Error('Not enough DONKI events were returned.');
    return picked;
  }

  function readStormCache() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(STORM_CACHE_KEY) || 'null');
      if (!saved || saved.signature !== JSON.stringify(DONKI_REQUESTS) || !Array.isArray(saved.storms)) return null;
      const ageHours = (Date.now() - saved.savedAt) / 3600000;
      if (!(ageHours >= 0 && ageHours < STORM_CACHE_HOURS)) return null;
      const valid = saved.storms.filter(isValidStorm);
      return valid.length >= MIN_REAL_STORMS ? valid : null;
    } catch (error) {
      return null; // Storage can be blocked. That is fine: the game just asks NASA again.
    }
  }

  function writeStormCache(list) {
    try {
      window.localStorage.setItem(STORM_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), signature: JSON.stringify(DONKI_REQUESTS), storms: list }));
    } catch (error) { /* Ignore: saving is only a convenience. */ }
  }

  // Put the real events into the game. A mission that has not started yet is refreshed too.
  function refreshMissionStorms() {
    const early = state.screen === 'title' || state.screen === 'briefing' ||
      (state.screen === 'about' && (state.previousScreen === 'title' || state.previousScreen === 'briefing'));
    if (early) {
      const shuffled = shuffle(STORMS);
      const list = [];
      for (let i = 0; i < DAYS; i++) list.push(shuffled[i % shuffled.length]);
      state.storms = list;
    }
    if (state.screen === 'title' || state.screen === 'about') render();
  }

  function applyRealStorms(list, how) {
    STORMS.splice(0, STORMS.length, ...list);
    USING_REAL_DATA = true;
    stormDataMessage = 'Storm cards use ' + list.length + ' real NASA DONKI events (' + how + ').';
    refreshMissionStorms();
  }

  async function loadRealStorms() {
    if (NASA_KEY === 'DEMO_KEY') console.warn('Storm or Shine: using the shared DEMO_KEY. Add your own free key from api.nasa.gov to avoid rate limits.');
    const cached = readStormCache();
    if (cached) {
      applyRealStorms(cached, 'saved from an earlier visit');
      return;
    }
    try {
      const fetched = await fetchDonkiStorms();
      writeStormCache(fetched);
      applyRealStorms(fetched, 'fetched from NASA just now');
    } catch (error) {
      const archived = ARCHIVED_STORMS.filter(isValidStorm);
      if (archived.length >= MIN_REAL_STORMS) {
        applyRealStorms(archived, 'archived file saved with the game');
      } else {
        stormDataMessage = 'Storm cards use clearly marked sample events because NASA DONKI could not be reached.';
        if (state.screen === 'title' || state.screen === 'about') render();
      }
    }
  }

  // Looks for related spaceflight studies in NASA OSDR and shows one title per learning card.
  // It only lists a study; it does not claim the study proves anything on the card.
  async function loadOsdrRelated() {
    if (!OSDR_LOOKUP) return;
    const controller = new AbortController();
    const timeout = window.setTimeout(function() { controller.abort(); }, 8000);
    try {
      const response = await fetch('https://osdr.nasa.gov/osdr/data/search?term=' + encodeURIComponent('spaceflight radiation'), { signal: controller.signal });
      if (!response.ok) throw new Error('OSDR search failed');
      const data = await response.json();
      const hits = data && data.hits && Array.isArray(data.hits.hits) ? data.hits.hits : [];
      const found = [];
      hits.forEach(function(hit) {
        const source = (hit && hit._source) || {};
        const id = String(source.Accession || '');
        const title = String(source['Study Title'] || '').trim();
        if (/^OSD-\d+$/.test(id) && title && title.length < 220 && /space|radiation|microgravity/i.test(title) && !found.some(function(f) { return f.id === id; })) found.push({ id: id, title: title });
      });
      ['SEP', 'flare', 'CME'].forEach(function(topic, index) { if (found[index]) OSDR_RELATED[topic] = found[index]; });
    } catch (error) {
      // No OSDR line is shown. The game works the same without it.
    } finally {
      window.clearTimeout(timeout);
      if (state.screen === 'about') render();
    }
  }

  function osdrLine(topic) {
    const item = OSDR_RELATED[topic];
    if (!item) return '';
    return `<div class="real-science"><strong>Explore related NASA research:</strong> ${escapeHtml(item.title)} <span>NASA OSDR study ${escapeHtml(item.id)} · <a href="${OSDR_REPOSITORY_URL}" target="_blank" rel="noopener">Open the NASA OSDR repository</a></span></div>`;
  }

  // Start at the title screen, then check the live-data panel and load the real NASA storm records.
  resetGame();
  loadLiveStorms();
  loadRealStorms();
  loadOsdrRelated();
</script>
</body>
</html>
